name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry/bin
          key: ${{ runner.os }}-foundry-stable
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Forge version
        run: |
          forge --version

      - name: Cache Neo Huff
        uses: actions/cache@v4
        with:
          path: ~/.huff-neo/bin
          key: ${{ runner.os }}-hnc-v1
          restore-keys: |
            ${{ runner.os }}-hnc-

      - name: Install Neo Huff (hnc-up + hnc)
        run: |
          curl -L https://raw.githubusercontent.com/cakevm/huff-neo/main/hnc-up/install | bash
          echo "$HOME/.huff-neo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.huff-neo/bin:$PATH"

          hnc --version
      - name: Install hnc via hnc-up
        run: |
          hnc-up
          hnc --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
