name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Install Neo Huff
        run: |
          curl -L https://raw.githubusercontent.com/cakevm/huff-neo/main/hnc-up/install | bash
          echo "$HOME/.huff-neo/bin" >> $GITHUB_PATH

      - name: Install hnc via hnc-up
        run: |
          echo "$HOME/.huff-neo/bin" >> $GITHUB_PATH
          hnc-up
          hnc --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge tests
        run: |
          echo "$HOME/.huff-neo/bin" >> $GITHUB_PATH
          forge test -vvv
        id: test
